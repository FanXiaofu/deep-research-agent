worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker 内置 DNS；resolve 让 upstream 跟随 compose --scale 的副本变化
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,'
        '"upstream":"$upstream_addr","request_time":$request_time}';
    access_log /dev/stdout json;
    error_log /var/log/nginx/error.log warn;

    upstream app_backend {
        zone app_backend 64k;
        server app:8000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        # 与 app 的 64KB 请求体上限一致，代理层先拒绝
        client_max_body_size 64k;
        client_body_timeout 15s;

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            # SSE 不能缓冲；长研究允许 1h
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
