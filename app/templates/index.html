<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research Agent · 多 Agent 深度研究助手</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-max-llm-calls="{{ max_llm_calls }}">
<div class="wrap">
  <h1>🔬 Deep Research Agent</h1>
  <div class="sub">多 Agent 深度研究助手 · 模型 <b>{{ model }}</b> · 搜索 <b>{{ provider }}</b> · Langfuse <b>{{ "已启用" if langfuse else "未启用" }}</b></div>

  <div class="panel">
    <textarea id="topic" placeholder="输入研究主题，例如：LangGraph 和 CrewAI 有什么区别，各自适合什么场景"></textarea>
    <div class="row">
      <label class="grow">访问令牌
        <input type="password" id="auth-token" placeholder="{% if auth_required %}必填：APP_AUTH_TOKEN{% else %}本机访问可留空{% endif %}" autocomplete="off">
      </label>
    </div>
    <div class="row">
      <label>子问题上限 <input type="number" id="max-sub" min="1" max="{{ max_sub_limit }}" value="{{ max_sub_default }}" class="num"></label>
      <label>检索轮数 <input type="number" id="rounds" min="1" max="{{ rounds_limit }}" value="{{ rounds_default }}" class="num"></label>
      <label><input type="checkbox" id="review-brief" {% if "brief" in review_points %}checked{% endif %}> 审核任务书</label>
      <label><input type="checkbox" id="review-plan" {% if "plan" in review_points %}checked{% endif %}> 审核子问题</label>
      <span class="grow"></span>
      <button id="btn-start">开始研究</button>
    </div>
    <div class="muted hint" id="scale-hint"></div>
    <div class="status hide" id="status"><span class="dot"></span><span id="status-text">研究中…</span></div>
  </div>

  <div class="panel hide" id="timeline-panel">
    <div id="timeline"></div>
  </div>

  <div class="panel hide" id="review-panel">
    <h3 id="review-title">⏸ human-in-the-loop：请审核</h3>
    <div id="brief-view" class="md brief-view"></div>
    <textarea id="brief-edit" class="hide brief-edit"></textarea>
    <div class="row">
      <button id="btn-confirm">确认继续</button>
      <button id="btn-edit" class="ghost">修改</button>
      <button id="btn-resume" class="hide">使用修改后的内容</button>
    </div>
  </div>

  <div class="panel hide" id="report-panel">
    <h2>📄 研究报告</h2>
    <div class="chips" id="stats"></div>
    <button id="btn-copy" class="ghost copy-btn">复制 Markdown</button>
    <div class="md" id="report"></div>
  </div>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
