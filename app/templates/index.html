<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research Agent · 多 Agent 深度研究助手</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --line:#2a2e3d; --text:#e2e5ee; --muted:#8b91a5; --acc:#5b8cff; --ok:#3fbf7f; --warn:#e0a24a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .sub b { color:var(--acc); font-weight:600; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  textarea, input[type=text], input[type=password], select { width:100%; background:#12141c; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; font-family:inherit; }
  textarea { resize:vertical; min-height:64px; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .row label { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  select { width:auto; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:400; }
  .ev { display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .ev:last-child { border-bottom:0; }
  .ev .tag { flex:none; width:96px; color:var(--acc); font-weight:600; }
  .ev .t { flex:none; width:52px; color:var(--muted); font-size:12px; padding-top:2px; }
  .ev .body { flex:1; line-height:1.6; }
  .ev .body li { margin:2px 0; }
  .muted { color:var(--muted); }
  #review-panel { border-color:var(--warn); }
  #review-panel h3 { margin:0 0 8px; font-size:15px; color:var(--warn); }
  #report-panel h2 { font-size:18px; margin:0 0 10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { background:#12141c; border:1px solid var(--line); border-radius:99px; padding:4px 12px; font-size:12px; color:var(--muted); }
  .chip b { color:var(--text); font-weight:600; }
  .md { line-height:1.75; font-size:14.5px; overflow-wrap:break-word; }
  .md h1 { font-size:20px; } .md h2 { font-size:17px; margin-top:22px; border-bottom:1px solid var(--line); padding-bottom:6px; } .md h3 { font-size:15px; }
  .md a { color:var(--acc); }
  .md code { background:#12141c; padding:1px 5px; border-radius:4px; font-size:13px; }
  .err { color:#ff7b7b; }
  .hide { display:none; }
  .status { color:var(--muted); font-size:13px; margin:8px 0; }
  .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--warn); margin-right:6px; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 Deep Research Agent</h1>
  <div class="sub">多 Agent 深度研究助手 · 模型 <b>{{ model }}</b> · 搜索 <b>{{ provider }}</b> · Langfuse <b>{{ "已启用" if langfuse else "未启用" }}</b></div>

  <div class="panel">
    <textarea id="topic" placeholder="输入研究主题，例如：LangGraph 和 CrewAI 有什么区别，各自适合什么场景"></textarea>
    <div class="row">
      <label style="flex:1">访问令牌
        <input type="password" id="auth-token" placeholder="{% if auth_required %}必填：APP_AUTH_TOKEN{% else %}本机访问可留空{% endif %}" autocomplete="off">
      </label>
    </div>
    <div class="row">
      <label>子问题上限 <input type="number" id="max-sub" min="1" max="{{ max_sub_limit }}" value="{{ max_sub_default }}" style="width:68px" oninput="updateScaleHint()"></label>
      <label>检索轮数 <input type="number" id="rounds" min="1" max="{{ rounds_limit }}" value="{{ rounds_default }}" style="width:68px" oninput="updateScaleHint()"></label>
      <label><input type="checkbox" id="review-brief" {% if "brief" in review_points %}checked{% endif %}> 审核任务书</label>
      <label><input type="checkbox" id="review-plan" {% if "plan" in review_points %}checked{% endif %}> 审核子问题</label>
      <span style="flex:1"></span>
      <button id="btn-start" onclick="startResearch()">开始研究</button>
    </div>
    <div class="muted" id="scale-hint" style="font-size:12px;margin-top:8px"></div>
    <div class="status hide" id="status"><span class="dot"></span><span id="status-text">研究中…</span></div>
  </div>

  <div class="panel hide" id="timeline-panel">
    <div id="timeline"></div>
  </div>

  <div class="panel hide" id="review-panel">
    <h3 id="review-title">⏸ human-in-the-loop：请审核</h3>
    <div id="brief-view" class="md" style="margin-bottom:10px;white-space:pre-wrap"></div>
    <textarea id="brief-edit" class="hide" style="min-height:100px"></textarea>
    <div class="row">
      <button onclick="resume('')">确认继续</button>
      <button class="ghost" onclick="toggleEdit()">修改</button>
      <button id="btn-resume" class="hide" onclick="resumeFromEdit()">使用修改后的内容</button>
    </div>
  </div>

  <div class="panel hide" id="report-panel">
    <h2>📄 研究报告</h2>
    <div class="chips" id="stats"></div>
    <button class="ghost" style="margin-bottom:12px" onclick="copyMd()">复制 Markdown</button>
    <div class="md" id="report"></div>
  </div>
</div>

<script>
let threadId = null, lastMd = "", gotFirst = false;

function fmt(s) { return s + "s"; }
function show(id) { document.getElementById(id).classList.remove("hide"); }
function status(text) { show("status"); document.getElementById("status-text").textContent = text; }
function done() { document.getElementById("status").classList.add("hide"); setBtn(false); }
function setBtn(b) { document.getElementById("btn-start").disabled = b; }

function addEvent(label, html, elapsed) {
  const div = document.createElement("div");
  div.className = "ev";
  div.innerHTML = `<span class="tag">${label}</span><span class="t">${fmt(elapsed ?? "")}</span><span class="body">${html}</span>`;
  const tl = document.getElementById("timeline");
  tl.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function handle(data) {
  if (data.type === "start") {
    threadId = data.thread_id;
    status("研究中…（" + esc(data.topic) + "）");
  } else if (data.type === "node_done") {
    let body = "";
    if (data.node === "coordinator") body = "生成研究任务书：<i>" + esc(data.brief.slice(0, 80)) + "…</i>";
    else if (data.node === "planner") {
      body = (data.replan_count
        ? "第 " + data.replan_count + " 轮重规划，针对缺口新增 "
        : "拆解出 ") + data.subquestions.length + " 个子问题：<ul>" +
        data.subquestions.map(s => "<li>" + esc(s) + "</li>").join("") + "</ul>";
      if (data.memory_reused && data.memory_reused.length) {
        body += "🧠 复用历史研究 " + data.memory_reused.length + " 条（未重新检索）：<ul>" +
          data.memory_reused.map(h => "<li>" + esc(h.subquestion) + "（相似度 " + h.similarity +
            "，" + h.age_days + " 天前）</li>").join("") + "</ul>";
      }
    }
    else if (data.node === "researcher") body = "完成「" + esc(data.subquestion) + "」（" + data.n_sources + " 个来源）";
    else if (data.node === "compactor") body = data.compaction && data.compaction.applied
      ? "笔记压缩 " + data.compaction.before_chars + "→" + data.compaction.after_chars + " 字（" + data.compaction.ratio + "×，来源列表不变）"
      : "笔记长度未超阈值，跳过压缩";
    else if (data.node === "verifier") body = (data.conflicts && data.conflicts.length
      ? "发现 " + data.conflicts.length + " 处来源冲突：<ul>" + data.conflicts.slice(0, 3).map(c => "<li>" + esc(c) + "</li>").join("") + "</ul>"
      : "交叉比对完成，未发现明显冲突")
      + (data.gaps && data.gaps.length ? "另有 " + data.gaps.length + " 处待补缺口（将触发重规划）" : "");
    else if (data.node === "writer") body = "报告撰写完成";
    else if (data.node === "archivist") body = data.memory_written
      ? "落档 " + data.memory_written + " 条笔记到研究档案（下次同题研究可复用）" : "无新增笔记可落档";
    addEvent(data.label, body, data.elapsed_s);
  } else if (data.type === "interrupt") {
    document.getElementById("review-title").textContent =
      "⏸ human-in-the-loop：请审核" + (data.title || "内容");
    document.getElementById("brief-view").textContent = data.content || "";
    document.getElementById("brief-edit").value = data.content || "";
    show("review-panel");
    done();
  } else if (data.type === "report") {
    lastMd = data.markdown;
    document.getElementById("report").innerHTML = data.html;
    const s = data.stats;
    const budgetChip = s.budget_exceeded
      ? "<span class='chip' style='color:#b45309'>⚠ 触发预算上限（" + esc(s.budget_exceeded) + "）</span>"
      : "<span class='chip'>剩余额度 " + s.remaining.llm_calls_left + " 次调用 / " + s.remaining.seconds_left + "s</span>";
    const compactChip = s.compaction && s.compaction.applied
      ? "<span class='chip'>笔记压缩 " + s.compaction.before_chars + "→" + s.compaction.after_chars + " 字</span>" : "";
    const degradedChip = (s.degradations && s.degradations.length)
      ? "<span class='chip' style='color:#b45309'>⚠ 依赖降级 " + s.degradations.length + " 次</span>" : "";
    const audit = s.citation_audit || {};
    const auditChip = (audit.invalid_citations || audit.unknown_links)
      ? "<span class='chip' style='color:#b45309'>⚠ 引用校验移除 " +
        (audit.invalid_citations || 0) + " 引用 / " + (audit.unknown_links || 0) + " 链接</span>" : "";
    const memoryChip = s.memory_reused
      ? "<span class='chip'>🧠 复用历史研究 " + s.memory_reused + " 条</span>"
      : (s.memory_written ? "<span class='chip'>📝 落档 " + s.memory_written + " 条</span>" : "");
    document.getElementById("stats").innerHTML = [
      "子问题 <b>" + s.subquestions + "</b>", "笔记 <b>" + s.notes + "</b>",
      "LLM 调用 <b>" + s.llm_calls + "</b>", "tokens <b>" + s.input_tokens + " + " + s.output_tokens + "</b>",
      "成本估算 <b>$" + s.cost_usd_est + "</b>", "耗时 <b>" + fmt(s.elapsed_s) + "</b>",
    ].map(c => `<span class="chip">${c}</span>`).join("") + budgetChip + compactChip + memoryChip + degradedChip + auditChip;
    show("report-panel");
    done();
  } else if (data.type === "error") {
    addEvent("❌ 出错", `<span class="err">${esc(data.message)}</span>`, "");
    done();
  }
}

function authHeaders() {
  const token = document.getElementById("auth-token").value.trim();
  return token ? { Authorization: "Bearer " + token } : {};
}

function listen(url, body) {
  setBtn(true);
  show("timeline-panel");
  gotFirst = false;
  (async () => {
    let resp;
    try {
      resp = await fetch(url, {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify(body),
      });
    } catch (e) {
      addEvent("❌ 请求失败", `<span class='err'>${esc(e.message || "网络错误")}</span>`, "");
      done();
      return;
    }
    if (!resp.ok) {
      let msg = "HTTP " + resp.status;
      try {
        const j = await resp.json();
        if (j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail);
      } catch (_) {}
      addEvent("❌ 请求失败", `<span class='err'>${esc(msg)}</span>`, "");
      done();
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    try {
      while (true) {
        const { value, done: streamDone } = await reader.read();
        if (streamDone) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 2);
          if (!chunk) continue;
          const line = chunk.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;
          gotFirst = true;
          handle(JSON.parse(line.slice(6)));
        }
      }
    } catch (e) {
      addEvent("❌ 连接中断", `<span class='err'>${esc(e.message || "读取响应失败")}</span>`, "");
    } finally {
      done();
    }
  })();
}

function updateScaleHint() {
  const sub = parseInt(document.getElementById("max-sub").value, 10);
  const rnd = parseInt(document.getElementById("rounds").value, 10);
  const hint = document.getElementById("scale-hint");
  if (!(sub >= 1) || !(rnd >= 1)) { hint.textContent = "子问题上限与检索轮数都需 ≥ 1"; return; }
  const est = sub * rnd;
  const budget = {{ max_llm_calls }};
  hint.textContent = "预计笔记阶段 ≈ " + est + " 次 LLM 调用（预算 " + budget + " 次）"
    + (est > budget ? "　⚠ 可能提前触发预算上限，报告会标注研究受限" : "");
}

function startResearch() {
  const topic = document.getElementById("topic").value.trim();
  if (!topic) { alert("请输入研究主题"); return; }
  ["timeline-panel", "review-panel", "report-panel"].forEach(id => document.getElementById(id).classList.add("hide"));
  document.getElementById("timeline").innerHTML = "";
  const points = [];
  if (document.getElementById("review-brief").checked) points.push("brief");
  if (document.getElementById("review-plan").checked) points.push("plan");
  const maxSub = parseInt(document.getElementById("max-sub").value, 10);
  const rounds = parseInt(document.getElementById("rounds").value, 10);
  if (!(maxSub >= 1) || !(rounds >= 1)) { alert("子问题上限与检索轮数都需 ≥ 1"); return; }
  listen("/api/research/stream", { topic: topic, points: points, max_sub: maxSub, rounds: rounds });
}

function toggleEdit() {
  document.getElementById("brief-view").classList.toggle("hide");
  document.getElementById("brief-edit").classList.toggle("hide");
  document.getElementById("btn-resume").classList.toggle("hide");
}

function resume(value) {
  document.getElementById("review-panel").classList.add("hide");
  listen("/api/resume/stream", { thread_id: threadId, value: value });
}

function resumeFromEdit() { resume(document.getElementById("brief-edit").value); }

function copyMd() { navigator.clipboard.writeText(lastMd); }
updateScaleHint();
</script>
</body>
</html>
