# Render Blueprint：单实例 Web + Render Postgres。
# 首次部署会提示填写 LLM_API_KEY、SEARCH_API_KEY、APP_AUTH_TOKEN。
services:
  - type: web
    name: deep-research-agent
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 150
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_BASE_URL
        value: https://api.commandcode.ai/provider/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-v4-flash
      - key: LLM_NATIVE_OLLAMA
        value: "0"
      - key: LLM_CALL_TIMEOUT_S
        value: "300"
      - key: LLM_MAX_RETRIES
        value: "0"
      - key: LLM_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_API_KEY
        sync: false
      - key: APP_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: deep-research-db
          property: connectionString
      - key: MEMORY_ENABLED
        value: "true"
      - key: AGENT_MODE
        value: "on"
      - key: AGENT_MAX_STEPS
        value: "4"
      - key: AGENT_VERIFIER_MAX_STEPS
        value: "3"
      - key: AGENT_WRITER_REVISIONS
        value: "1"
      - key: MAX_SUBQUESTIONS
        value: "4"
      - key: MAX_SEARCH_ROUNDS
        value: "2"
      - key: MAX_WALL_CLOCK_S
        value: "600"
      - key: MAX_LLM_CALLS
        value: "40"
      - key: MAX_TOTAL_TOKENS
        value: "120000"
      - key: AUTH_DEFAULT_DAILY_QUOTA
        value: "10"
      - key: APP_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: REVIEW_POINTS
        value: ""
      - key: LOG_JSON
        value: "1"

databases:
  - name: deep-research-db
    databaseName: deep_research
    user: deep_research
    plan: free
    region: singapore
    ipAllowList: []
