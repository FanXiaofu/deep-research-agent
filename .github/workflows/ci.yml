name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests stub LLM/search; these values only keep config importable and tracing off.
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_MODEL: qwen2.5:7b-instruct
      LLM_NATIVE_OLLAMA: "0"
      SEARCH_PROVIDER: duckduckgo
      SEARCH_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      MEMORY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deep-research-agent:ci .

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deep-research-agent:runtime .

      - name: Start container
        run: |
          docker run -d --name dr-runtime -p 8000:8000 \
            -e LLM_API_KEY=test-key \
            -e LLM_BASE_URL=http://localhost:11434/v1 \
            -e LLM_MODEL=qwen2.5:7b-instruct \
            -e SEARCH_PROVIDER=duckduckgo \
            deep-research-agent:runtime

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs dr-runtime
          exit 1

      - name: Verify non-root
        run: test "$(docker exec dr-runtime id -u)" = "10001"

      - name: Cleanup
        if: always()
        run: docker rm -f dr-runtime
