name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests stub LLM/search; these values only keep config importable and tracing off.
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_MODEL: qwen2.5:7b-instruct
      LLM_NATIVE_OLLAMA: "0"
      SEARCH_PROVIDER: duckduckgo
      SEARCH_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      MEMORY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deep-research-agent:ci .

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deep-research-agent:runtime .

      - name: Start container
        run: |
          docker run -d --name dr-runtime -p 8000:8000 \
            -e LLM_API_KEY=test-key \
            -e LLM_BASE_URL=http://localhost:11434/v1 \
            -e LLM_MODEL=qwen2.5:7b-instruct \
            -e SEARCH_PROVIDER=duckduckgo \
            deep-research-agent:runtime

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs dr-runtime
          exit 1

      - name: Verify non-root
        run: test "$(docker exec dr-runtime id -u)" = "10001"

      - name: Cleanup
        if: always()
        run: docker rm -f dr-runtime

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: deep_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/deep_research
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run Postgres storage tests
        run: python -m pytest tests/test_postgres_store.py -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t deep-research-agent:ci .

      - name: Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            deep-research-agent:ci

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose and Caddy configuration
        env:
          APP_DOMAIN: http://localhost:8080
          POSTGRES_PASSWORD: ci-postgres
          REDIS_PASSWORD: ci-redis
        run: |
          touch .env
          docker compose -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.redis.yml config >/dev/null
          docker run --rm -e APP_DOMAIN=http://localhost:8080 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run Redis shared-state tests
        run: python -m pytest tests/test_redis_backend.py -q
